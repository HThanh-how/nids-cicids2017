apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-inference
  labels: {app: ids-inference}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ids-inference}
  template:
    metadata:
      labels: {app: ids-inference}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ids-inference:3.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          env:
            # Measured, not assumed: leaving the numerical libraries free to
            # use every core makes replication counterproductive -- throughput
            # fell from 269 to 88 req/s as replicas went 1 to 8. Pinning is
            # worth 1.5-2.8x at every replica count (see S10_scaling.json).
            - {name: OMP_NUM_THREADS, value: "1"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: MKL_NUM_THREADS, value: "1"}
          # Derived from measurement rather than habit: resident memory is
          # 176 MiB per replica pinned, flat in replica count. The request
          # leaves ~45 % headroom and the limit twice the observed peak.
          resources:
            requests: {cpu: "500m", memory: "256Mi"}
            limits:   {cpu: "1000m", memory: "512Mi"}
          # Readiness gates traffic until the model is in memory; the gap
          # between pod start and readiness is the cold start we report.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
